<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>❤️ Happy Girlfriend's Day ❤️</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>

</head>

<body>

    <!-- Background -->

    <canvas id="canvas"></canvas>

    <div id="heart-container"></div>

    <!-- Music -->

    <audio id="music" loop>
        <source src="music.mp3" type="audio/mp3">
    </audio>

    <button id="musicBtn">
        <i class="fa-solid fa-music"></i>
    </button>

    <!-- Hero -->

    <section class="hero">

        <h1>Happy Girlfriend's Day ❤️</h1>

        <p>
            A little surprise made only for you...
        </p>

        <button id="open">
            Open My Heart ❤️
        </button>

    </section>

    <!-- Letter Section -->

    <section id="letterSection">

        <section id="letterSection">

    <div class="envelope" id="envelope">

        <div class="back"></div>

        <div class="letter">

            <h2>💖 To My Januu 💖</h2>

            <p id="typing"></p>

        </div>

        <div class="front"></div>

        <div class="flap"></div>

    </div>

</section>

    </section>

    <!-- Rose -->

    <section class="rose-section">

        <div class="rose">
            🌹
        </div>

    </section>

        <!-- Gallery -->

    <section class="gallery">

        <h2>My Beautiful Lady ❤️</h2>

        <div class="photos">

            <img src="photos/1.jpeg" alt="Memory 1">

            <img src="photos/2.jpeg" alt="Memory 2">

            <img src="photos/3.jpeg" alt="Memory 3">

            <img src="photos/4.jpeg" alt="Memory 4">

        </div>

    </section>

    <!-- Final -->

    <section class="final">

        <h1>❤️ Happy Girlfriend's Day ❤️</h1>

        <p>

            No matter where life takes us,

            I'll always choose you.

            Today.

            Tomorrow.

            Forever.

        </p>

        <button id="fireworks">

            Celebrate ❤️

        </button>

    </section>

        <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
